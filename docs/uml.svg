<text x="710" y="795" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">Modelo anterior mantido no domínio:</text>
<text x="710" y="832" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">Cliente, Tecnico, Equipamento, Notebook, Desktop,</text>
<text x="710" y="864" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">RoteiroDiagnostico, PoliticaCobranca, PoliticasCobranca,</text>
<text x="710" y="896" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">CobrancaNotebook, CobrancaDesktop e os dois enums.</text>
<text x="710" y="928" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">As relações internas desse modelo estão no UML da A11.</text>
<text x="40" y="1420" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">Seta tracejada: dependência. Triângulo vazio tracejado: realização de interface.</text>
<text x="40" y="1455" font-family="Arial" font-size="20" font-weight="normal" fill="#172b40">Recorte da A12: app → domínio e repositório; repositório → domínio. Domínio não importa implementações.</text>
